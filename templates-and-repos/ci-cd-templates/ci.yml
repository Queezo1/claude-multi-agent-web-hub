# Web Design Hub — Standard CI-Gate (siehe CLAUDE.md Abschnitt 2f)
# Ziel-Pfad im Projekt: .github/workflows/ci.yml
#
# Merge-Kriterium: alle Jobs müssen grün sein. Kein manuelles Übergehen
# (kein "Merge without waiting for requirements" bei rotem Lauf).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Security Audit (Abschnitt 4 — nicht nur einmalig, sondern bei jedem PR)
        run: npm audit --audit-level=high

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E + a11y + visuelle Regression (Abschnitt 2e)
        run: npx playwright test

      - name: Playwright Report hochladen (bei Fehlschlag)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
